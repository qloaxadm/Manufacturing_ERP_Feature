services:
  - type: web
    name: erp-barcode-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Database: Supabase (Postgres). Paste the "Session pooler" connection string
      # (Supabase dashboard -> Connect). Render is IPv4-only, so use the pooler host
      # (aws-0-<region>.pooler.supabase.com), not the direct db.<ref>.supabase.co host.
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
